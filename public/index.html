```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeGuardian</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page">

        <div class="card">

            <h1>SafeGuardian</h1>

            <p class="subtitle">
                Personal Safety & Emergency Response
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p style="margin-top: 20px;">
                Don't have an account?
                <a href="/register.html">
                    Create an account
                </a>
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
```
