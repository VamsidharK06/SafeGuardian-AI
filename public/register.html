<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SafeGuardian</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page">

        <div class="card">

            <h1>SafeGuardian</h1>

            <p class="subtitle">
                Create your account
            </p>

            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <p id="message"></p>

            <p style="margin-top: 20px;">
                Already have an account?
                <a href="/">
                    Login
                </a>
            </p>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
