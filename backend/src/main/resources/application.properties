spring.application.name=safeguard-backend

server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL
# Configure these via environment variables instead of committing real
# credentials to source control.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/safeguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable unnecessary warning
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Optional: automatic SMS delivery for SOS alerts via Twilio.
# Leave TWILIO_ENABLED unset/false to run without it - the SOS endpoint will
# still work, it just won't be able to send SMS messages automatically.
# ---------------------------------------------------------------------------
twilio.enabled=${TWILIO_ENABLED:false}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# ---------------------------------------------------------------------------
# Optional: automatic WhatsApp delivery for SOS alerts via Twilio's WhatsApp
# Business API. This sends the emergency message to EVERY saved contact
# automatically - no browser tabs, no manual "tap Send" step.
#
# WHATSAPP_ACCOUNT_SID / WHATSAPP_AUTH_TOKEN default to your existing
# TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN if set, since WhatsApp runs through
# the same Twilio account - set them separately only if you use a different
# Twilio account for WhatsApp.
#
# WHATSAPP_FROM_NUMBER must include the "whatsapp:" prefix, e.g.
# whatsapp:+14155238886 (Twilio's sandbox number) or your approved WhatsApp
# Business sender once you have one. Leave WHATSAPP_ENABLED unset/false to
# run without it - contacts will be reported as NOT_CONFIGURED rather than
# a false "SENT".
# ---------------------------------------------------------------------------
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.account-sid=${WHATSAPP_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:}}
whatsapp.auth-token=${WHATSAPP_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:}}
whatsapp.from-number=${WHATSAPP_FROM_NUMBER:}

# ---------------------------------------------------------------------------
# Optional: the separate Python FastAPI AI service (ai-service/ folder -
# YOLOv11, OpenCV, PyTorch, Whisper, MediaPipe). Disabled by default - the
# built-in rule-based AIService keeps powering /api/ai/analyze either way.
# When enabled, the new /api/ai/analyze-advanced endpoint forwards text to
# this service and returns its fused assessment; when disabled or
# unreachable, that endpoint clearly falls back to the rule-based result
# instead of failing or faking a response.
# ---------------------------------------------------------------------------
ai-service.enabled=${AI_SERVICE_ENABLED:false}
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}

# ---------------------------------------------------------------------------
# Multimodal SOS evidence (POST /api/emergency/sos): a short captured camera
# image/video and/or a short captured voice clip, sent to Twilio's WhatsApp
# API alongside the emergency text message and current location.
#
# Twilio must be able to fetch evidence from a public URL - PUBLIC_BASE_URL
# is how you tell the backend what that URL is. During local development,
# run a tunnel (e.g. `cloudflared tunnel --url http://localhost:8080`) and
# set PUBLIC_BASE_URL to the https://xxxx.trycloudflare.com URL it prints.
# Leave PUBLIC_BASE_URL unset to still run the app - the text alert with
# location still sends, evidence delivery is just reported as not possible
# rather than silently failing.
#
# media.storage.dir defaults to a "safeguard-media" folder under the OS temp
# directory. Stored files are deleted automatically after
# media.cleanup-delay-seconds (default 15 minutes) - this is short-lived
# per-SOS storage, not a permanent media archive.
# ---------------------------------------------------------------------------
media.public-base-url=${PUBLIC_BASE_URL:}
media.storage.dir=${MEDIA_STORAGE_DIR:${java.io.tmpdir}/safeguard-media}
media.cleanup-delay-seconds=${MEDIA_CLEANUP_DELAY_SECONDS:900}

# Keep captured evidence short: raise these only if you intentionally allow
# longer clips. 15MB comfortably covers a compressed photo/short video frame
# and a short voice clip while staying within typical WhatsApp media limits.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB
